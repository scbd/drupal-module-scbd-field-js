# PnP breaks vitest on Node 24 in this toolchain (ERR_REQUIRE_ESM), so use the
# node-modules linker. This gives up PnP's strict dependency isolation and its
# zip-integrity enforcement; the settings below are the compensating controls.
nodeLinker: node-modules

# Refuse any package whose tarball hash does not match the lockfile.
checksumBehavior: throw

# Resolve @scbd from public npm explicitly, so no ambient registry config can
# shadow the scope.
npmScopes:
  scbd:
    npmRegistryServer: "https://registry.npmjs.org"
